services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edumonitor-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./database:/scripts

  rabbitmq:
    image: rabbitmq:4-management
    container_name: edumonitor-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Define RABBITMQ_DEFAULT_USER in the root .env file}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Define RABBITMQ_DEFAULT_PASS in the root .env file}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: edumonitor-ollama
    profiles: ["ai"]
    volumes:
      - ollamadata:/root/.ollama

  academic-agent:
    build:
      context: ./agent
    container_name: edumonitor-agent
    profiles: ["ai"]
    environment:
      AGENT_API_KEY: ${ACADEMIC_AGENT_API_KEY:?Define ACADEMIC_AGENT_API_KEY in the root .env file}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_ALLOWED_HOST: ollama
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      - ollama

volumes:
  sqldata:
  rabbitdata:
  ollamadata:
