services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edumonitor-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./database:/scripts

volumes:
  sqldata:
